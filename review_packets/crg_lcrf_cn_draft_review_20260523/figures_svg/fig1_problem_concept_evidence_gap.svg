<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><style>
.title{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:28px;font-weight:700;fill:#17202A}.subtitle{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16px;fill:#3b4652}.label{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:18px;font-weight:700;fill:#1d2733}.small{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14px;fill:#3b4652}.tiny{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:12px;fill:#3b4652}.box{fill:#ffffff;stroke:#7f8c8d;stroke-width:1.6;rx:14}.blue{fill:#d8ecff;stroke:#4f86c6}.pink{fill:#ffe1e7;stroke:#c45a70}.green{fill:#e4f5e7;stroke:#54a65d}.yellow{fill:#fff0cc;stroke:#c9931f}.gray{fill:#f4f6f7;stroke:#9aa4ad}.arrow{stroke:#6b7785;stroke-width:2.2;fill:none;marker-end:url(#arrowhead)}.dash{stroke-dasharray:6 5}</style><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#6b7785"/></marker></defs><rect x="0" y="0" width="1200" height="680" fill="#fff"/><text x="60" y="62" class="title">图1：概念证据缺口（Concept Evidence Gap）</text><text x="60" y="92" class="subtitle">目标概念在学生历史中缺少直接证据时，诊断模型需要可审计的训练集概念路线，而不是只依赖题内共现。</text><rect x="70" y="150" width="220" height="140" class="box yellow"/><text x="180.0" y="184" class="label" text-anchor="middle">学生历史</text><text x="180.0" y="216" class="small" text-anchor="middle">已作答概念：h1, h2, h3</text><text x="180.0" y="236" class="small" text-anchor="middle">正确/错误记录有限</text><rect x="475" y="150" width="220" height="140" class="box gray"/><text x="585.0" y="184" class="label" text-anchor="middle">目标概念 c</text><text x="585.0" y="216" class="small" text-anchor="middle">当前测试题涉及</text><text x="585.0" y="236" class="small" text-anchor="middle">学生历史中未直接出现</text><path d="M290 220 C360 220 395 220 475 220" class="arrow dash"/><text x="365" y="205" class="small" text-anchor="middle">直接证据缺口</text><rect x="70" y="405" width="260" height="130" class="box blue"/><text x="200.0" y="439" class="label" text-anchor="middle">训练集经验路线</text><text x="200.0" y="471" class="small" text-anchor="middle">题内共现（可用时）</text><text x="200.0" y="491" class="small" text-anchor="middle">序列转移（主要路线）</text><text x="200.0" y="511" class="small" text-anchor="middle">自保持</text><rect x="475" y="405" width="260" height="130" class="box green"/><text x="605.0" y="439" class="label" text-anchor="middle">CRG 可达 support</text><text x="605.0" y="471" class="small" text-anchor="middle">只由 train split 构造</text><text x="605.0" y="491" class="small" text-anchor="middle">检索 held-out transition</text><rect x="855" y="405" width="260" height="130" class="box pink"/><text x="985.0" y="439" class="label" text-anchor="middle">LCRF 个性化过滤</text><text x="985.0" y="471" class="small" text-anchor="middle">同一 support 内</text><text x="985.0" y="491" class="small" text-anchor="middle">按学生状态重排 posterior</text><path d="M330 470 C395 470 420 470 475 470" class="arrow"/><path d="M735 470 C795 470 825 470 855 470" class="arrow"/><path d="M610 405 C610 330 610 315 610 292" class="arrow"/><text x="620" y="344" class="small" text-anchor="start">桥接目标概念</text><text x="60" y="625" class="tiny">注：sequence transition 表示训练日志中的经验学习路线，不声称为严格先修关系；item co-occurrence 只是可用时的证据源。</text></svg>