<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760"><defs><style>
.title{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:28px;font-weight:700;fill:#17202A}.subtitle{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16px;fill:#3b4652}.label{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:18px;font-weight:700;fill:#1d2733}.small{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14px;fill:#3b4652}.tiny{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:12px;fill:#3b4652}.box{fill:#ffffff;stroke:#7f8c8d;stroke-width:1.6;rx:14}.blue{fill:#d8ecff;stroke:#4f86c6}.pink{fill:#ffe1e7;stroke:#c45a70}.green{fill:#e4f5e7;stroke:#54a65d}.yellow{fill:#fff0cc;stroke:#c9931f}.gray{fill:#f4f6f7;stroke:#9aa4ad}.arrow{stroke:#6b7785;stroke-width:2.2;fill:none;marker-end:url(#arrowhead)}.dash{stroke-dasharray:6 5}</style><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#6b7785"/></marker></defs><rect x="0" y="0" width="1300" height="760" fill="#fff"/><text x="60" y="62" class="title">图3：机制证据链</text><text x="60" y="92" class="subtitle">每个实验只对应一个可检验 claim，避免把所有结果混成“全数据集充分必要”。</text><rect x="60" y="190" width="210" height="145" class="box yellow"/><text x="165.0" y="224" class="label" text-anchor="middle">数据现象</text><text x="165.0" y="256" class="small" text-anchor="middle">目标概念直接证据不足</text><text x="165.0" y="276" class="small" text-anchor="middle">但存在可桥接 route</text><text x="165" y="360" class="tiny" text-anchor="middle">dataset cards</text><path d="M270 262 L320 262" class="arrow"/><rect x="310" y="190" width="210" height="145" class="box blue"/><text x="415.0" y="224" class="label" text-anchor="middle">CRG 充分性</text><text x="415.0" y="256" class="small" text-anchor="middle">train-only CRG 检索</text><text x="415.0" y="276" class="small" text-anchor="middle">held-out transition</text><text x="415" y="360" class="tiny" text-anchor="middle">retrieval &gt; random/self</text><path d="M520 262 L570 262" class="arrow"/><rect x="560" y="190" width="210" height="145" class="box blue"/><text x="665.0" y="224" class="label" text-anchor="middle">CRG 支持依赖</text><text x="665.0" y="256" class="small" text-anchor="middle">破坏 support 观察预测损伤</text><text x="665.0" y="276" class="small" text-anchor="middle">assist_17 最干净</text><text x="665" y="360" class="tiny" text-anchor="middle">support corruption</text><path d="M770 262 L820 262" class="arrow"/><rect x="810" y="190" width="210" height="145" class="box pink"/><text x="915.0" y="224" class="label" text-anchor="middle">LCRF 必要性</text><text x="915.0" y="256" class="small" text-anchor="middle">真实学生状态不可被</text><text x="915.0" y="276" class="small" text-anchor="middle">mean/shuffle 替代</text><text x="915" y="360" class="tiny" text-anchor="middle">counterfactual</text><path d="M1020 262 L1070 262" class="arrow"/><rect x="1060" y="190" width="210" height="145" class="box pink"/><text x="1165.0" y="224" class="label" text-anchor="middle">LCRF 个案充分性</text><text x="1165.0" y="256" class="small" text-anchor="middle">同一 support 下不同学生</text><text x="1165.0" y="276" class="small" text-anchor="middle">posterior route 不同</text><text x="1165" y="360" class="tiny" text-anchor="middle">same-query case</text><rect x="90" y="480" width="1120" height="120" class="box gray"/><text x="650" y="520" class="label" text-anchor="middle">写作原则</text><text x="650" y="555" class="small" text-anchor="middle">CRG 是主模块：提供 train-only 可审计概念 support；LCRF 是副模块：在固定 support 内做学生条件化过滤。</text><text x="650" y="585" class="small" text-anchor="middle">禁止过度声称：不说 prerequisite、不说所有数据集都证明不是任意图、不说完全排除 student-ID shortcut。</text></svg>